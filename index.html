ion:absolute;right:-21px;top:6px;width:9px;height:9px;border:2px solid #fff;background:#66b3a4;border-radius:50%;box-shadow:0 0 0 1px #a8d4c9}.event strong{display:block;color:#25434a}.event small{color:#8da0a5;font-size:10px}
    .filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:17px}.input,.select,.textarea{width:100%;padding:11px 12px;border:1px solid #d8e3e6;border-radius:11px;background:#fff;color:var(--ink)}.filters .input{max-width:360px;flex:1 1 250px}.filters .select{max-width:185px;flex:1 1 150px}.record-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.record-grid .work-card{background:#fff}.record-grid .work-card:hover{background:#f8fbfa}.rule{height:1px;background:var(--border);margin:16px 0}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.field{display:flex;flex-direction:column;gap:7px;font-size:12px;font-weight:800}.field.full{grid-column:1/-1}.required{color:var(--danger)}.field .hint{font-weight:400;color:var(--muted);font-size:11px}.textarea{min-height:100px;resize:vertical}.upload{padding:20px;border:1.5px dashed #bcd7d1;border-radius:12px;background:#f8fbfa;color:#50746e}.upload input{display:block;margin-top:9px;max-width:100%}.helper-note{margin-top:11px;color:#8b6c23;background:#fff8e8;border:1px solid #ffebbd;padding:11px 13px;border-radius:10px;font-size:12px}
    .handoff-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:17px;margin-bottom:13px}.handoff-card .hsplit{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.handoff-card p{color:#657982;font-size:12px;margin:7px 0}.flow-users{display:flex;align-items:center;gap:9px;margin:10px 0;color:#324f55;font-weight:800}.flow-arrow{color:var(--teal);font-size:20px}.manager-bars{display:flex;flex-direction:column;gap:16px;margin-top:15px}.bar-row{display:flex;align-items:center;gap:11px;font-size:12px}.bar-label{width:84px;flex:0 0 84px}.bar-bg{height:11px;background:#eef3f3;border-radius:10px;flex:1;overflow:hidden}.bar-fill{height:100%;background:#168778;border-radius:10px}.bar-count{width:24px;font-weight:800;color:#3c6165;text-align:left}
    .modal-overlay{position:fixed;inset:0;background:#07171dcc;z-index:30;display:grid;place-items:center;padding:20px}.modal{background:#fff;border-radius:18px;width:min(640px,100%);max-height:90vh;overflow:auto;box-shadow:0 30px 80px #0004}.modal-head{padding:20px 23px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}.modal-body{padding:22px 23px}.modal-close{border:0;background:#edf3f3;width:32px;height:32px;border-radius:9px;font-size:20px;cursor:pointer}.detail-data{display:flex;flex-wrap:wrap;gap:9px;margin:15px 0}.modal-actions{border-top:1px solid var(--border);padding:16px 22px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}.t-label{font-size:11px;color:var(--muted);font-weight:750;display:block;margin-bottom:4px}.d-block{background:#f7faf9;border-radius:11px;padding:13px;margin-bottom:13px;white-space:pre-wrap}.toast{position:fixed;left:28px;bottom:26px;background:#1b4d48;color:#fff;border-radius:12px;padding:12px 17px;z-index:50;box-shadow:0 8px 22px #0002;display:none}.switch-hint{color:var(--muted);font-size:11px;margin-top:4px}.disclaimer{background:#fff9e9;color:#85621e;border:1px solid #f5e4af;border-radius:9px;padding:8px 12px;font-size:11px;max-width:290px}
    @media(max-width:1080px){.dashboard-grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.sidebar{width:215px;flex-basis:215px}.main{padding:24px}.topbar{padding:0 24px}}

<body>
<div class="app">
  <aside class="sidebar" aria-label="القائمة الرئيسية">
    <div class="brand"><div class="brand-mark">ن</div><div><div class="brand-main">نستكمل</div><small>اسم مؤقت · نموذج تجريبي</small></div></div>
    <div class="side-label">مساحة العمل</div>
    <nav class="side-nav" id="nav"></nav>
    <div class="side-bottom"><strong>العمل يستمر، والمعلومة ما تضيع.</strong> نموذج تفاعلي لتجربة التسليم والاستلام ومتابعة الأعمال داخل المؤسسة.</div>
  </aside>
  <section class="content">
    <header class="topbar"><div class="crumb">مؤسسة المدار للتشغيل <small>مساحة تجريبية · المملكة العربية السعودية</small></div><div class="top-actions"><div class="disclaimer">بيانات تجريبية محفوظة على هذا المتصفح فقط</div><select id="userSelect" class="user-picker" aria-label="اختيار المستخدم لتجربة الأدوار" onchange="switchUser(this.value)"></select><div class="avatar" id="avatar">أ</div></div></header>
    <main class="main" id="view"></main>
  </section>
</div>
<div id="modalRoot"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const STORE='nastakmil_demo_v2';
const PEOPLE={ahmad:{name:'أحمد',role:'موظف',initial:'أ'},khaled:{name:'خالد',role:'موظف',initial:'خ'},noura:{name:'نورة',role:'مشرفة',initial:'ن'},manager:{name:'مدير التشغيل',role:'مدير',initial:'م'}};
const DEPARTMENTS=['الصيانة','التشغيل','خدمة العملاء','الإدارة'];
const NAV=[['home','⌂','الرئيسية'],['records','▤','سجل العمل'],['handoffs','↔','التسليم والاستلام'],['manager','▥','لوحة المدير'],['new','＋','إضافة عمل']];
const STATUS={open:'مفتوحة',in_progress:'قيد العمل',pending:'بانتظار الاستلام',completed:'مكتملة',reopened:'أعيد فتحها'};
const PRIORITY={low:'منخفضة',normal:'متوسطة',high:'عالية',critical:'حرجة'};
const now=()=>new Date().toISOString();
function ago(h){return new Date(Date.now()-h*3600000).toISOString()}
function seed(){return {items:[
 {id:1001,title:'ارتفاع حرارة مضخة التبريد',type:'مشكلة',description:'تم رصد ارتفاع حرارة في مضخة التبريد بالموقع B، وأُجري فحص مبدئي للمحرك.',nextSteps:'يلزم مراجعة الحمل ومراقبة القراءة بعد تغيير الفلتر.',department:'الصيانة',site:'الموقع B',priority:'high',status:'pending',assignee:'ahmad',creator:'ahmad',createdAt:ago(5),dueAt:new Date(Date.now()+86400000).toISOString(),attachments:[{name:'صورة_المضخة.jpg',type:'image/jpeg'},{name:'شرح_العطل.m4a',type:'audio/mp4'}],events:[{at:ago(5),by:'ahmad',text:'أنشأ سجل المشكلة'},{at:ago(1),by:'ahmad',text:'طلب تسليم المتابعة إلى خالد'}]},
 {id:1002,title:'تجهيز تقرير الزيارات الأسبوعية',type:'مهمة',description:'تجميع زيارات الصيانة ورفع تقرير موحد لإدارة التشغيل.',nextSteps:'استكمال جدول المواقع الناقصة.',department:'التشغيل',site:'المكتب الرئيسي',priority:'normal',status:'in_progress',assignee:'noura',creator:'noura',createdAt:ago(13),dueAt:new Date(Date.now()+172800000).toISOString(),attachments:[{name:'كشف_الزيارات.xlsx',type:'application/vnd.ms-excel'}],events:[{at:ago(13),by:'noura',text:'أنشأت المهمة'},{at:ago(3),by:'noura',text:'تم جمع بيانات 6 مواقع من 8'}]},
 {id:1003,title:'متابعة طلب عميل رقم 428',type:'مهمة',description:'تم استقبال ملاحظة العميل وجمع الصور المطلوبة، وينتظر الرد النهائي.',nextSteps:'الاتصال بالعميل بعد اعتماد الرد.',department:'خدمة العملاء',site:'المكتب الرئيسي',priority:'high',status:'open',assignee:'khaled',creator:'ahmad',createdAt:ago(26),dueAt:new Date(Date.now()-3600000).toISOString(),attachments:[],events:[{at:ago(26),by:'ahmad',text:'أنشأ المهمة وكلّف خالد'}]},
 {id:1004,title:'إصلاح إنارة الممر الشمالي',type:'إنجاز',description:'فُحصت الأسلاك واستبدلت وحدتا إضاءة، والإنارة تعمل الآن.',nextSteps:'لا توجد متابعة مطلوبة.',department:'الصيانة',site:'الموقع A',priority:'low',status:'completed',assignee:'ahmad',creator:'ahmad',createdAt:ago(31),dueAt:null,attachments:[{name:'بعد_الإصلاح.jpg',type:'image/jpeg'}],events:[{at:ago(31),by:'ahmad',text:'أنشأ السجل'},{at:ago(18),by:'ahmad',text:'أغلق المهمة بعد إتمام العمل'}]}
 ],handoffs:[{id:2001,itemId:1001,from:'ahmad',to:'khaled',summary:'تم فحص المحرك وإيقاف المضخة مؤقتًا.',next:'استلام المتابعة وإجراء فحص الحمل.',status:'pending',createdAt:ago(1),respondedAt:null,responseNote:''}],nextId:3000}}
let db;
try{db=JSON.parse(localStorage.getItem(STORE))||seed()}catch(e){db=seed()}
let activeUser='ahmad',activePage='home',searchText='',statusFilter='all',departmentFilter='all';
const byId=id=>db.items.find(x=>String(x.id)===String(id));
const who=id=>PEOPLE[id]?.name||id;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>t?new Intl.DateTimeFormat('ar-SA',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Riyadh'}).format(new Date(t)):'غير محدد';
const overdue=x=>x.dueAt&&new Date(x.dueAt)<new Date()&&x.status!=='completed';
const pendingFor=person=>db.handoffs.filter(h=>h.to===person&&h.status==='pending');
const setDB=()=>localStorage.setItem(STORE,JSON.stringify(db));
function notify(message){const t=document.getElementById('toast');t.textContent=message;t.style.display='block';clearTimeout(notify.timer);notify.timer=setTimeout(()=>t.style.display='none',3200)}
function heading(kicker,title,sub,button=true){return `<div class="headline"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="subtitle">${sub}</p></div>${button?`<button class="btn primary" onclick="go('new')">＋ إضافة عمل</button>`:''}</div>`}
function statusPill(x){const cl=x==='reopened'?'open':x;return `<span class="pill ${cl}">${esc(STATUS[x]||x)}</span>`}
function priorityPill(p){return `<span class="pill ${esc(p)}">${esc(PRIORITY[p]||p)}</span>`}
function workCard(x){return `<article class="work-card" tabindex="0" role="button" aria-label="تفاصيل ${esc(x.title)}" onclick="details(${x.id})" onkeydown="if(event.key==='Enter')details(${x.id})"><div class="work-top"><div style="min-width:0"><div class="work-title">${esc(x.title)}</div><div class="work-desc">${esc(x.description)}</div></div>${statusPill(x.status)}</div><div class="work-meta"><span>◉ ${esc(x.department)}</span><span>👤 ${esc(who(x.assignee))}</span><span>📍 ${esc(x.site)}</span>${x.attachments.length?`<span>📎 ${x.attachments.length} مرفقات</span>`:''}${overdue(x)?'<span style="color:#b74f42;font-weight:800">متأخرة</span>':''}</div></article>`}
function renderNav(){document.getElementById('nav').innerHTML=NAV.map(([p,i,title])=>`<button class="nav-btn ${p===activePage?'active':''}" onclick="go('${p}')"><span class="emoji">${i}</span>${title}${p==='handoffs'&&pendingFor(activeUser).length?` <span class="pill pending" style="padding:1px 6px">${pendingFor(activeUser).length}</span>`:''}</button>`).join('')}
function stats(){const it=db.items;return [
 {title:'أعمال مفتوحة',value:it.filter(x=>x.status==='open'||x.status==='reopened').length,foot:'تحتاج بدءًا أو متابعة',icon:'☷'},
 {title:'قيد العمل',value:it.filter(x=>x.status==='in_progress').length,foot:'تجري متابعتها الآن',icon:'◷'},
 {title:'بانتظار الاستلام',value:db.handoffs.filter(x=>x.status==='pending').length,foot:'يتطلب إقرار المستلم',icon:'⇄'},
 {title:'مكتملة',value:it.filter(x=>x.status==='completed').length,foot:'أُغلقت بوثيقة عمل',icon:'✓'}
 ]}
function statCards(){return `<section class="stats">${stats().map(s=>`<div class="stat"><div class="stat-top">${s.title}<span class="stat-ico">${s.icon}</span></div><div class="stat-num">${s.value}</div><div class="stat-foot">${s.foot}</div></div>`).join('')}</section>`}
function dashboard(){const mine=db.items.filter(x=>x.assignee===activeUser&&x.status!=='completed').slice(0,4);const hand=pendingFor(activeUser);const recent=db.items.flatMap(x=>x.events.map(e=>({...e,title:x.title}))).sort((a,b)=>new Date(b.at)-new Date(a.at)).slice(0,5);return heading('نظرة عامة','صباح الخير، '+who(activeUser),'هذه صورة مبسطة للأعمال والمسؤوليات التي تحتاج متابعة.')+statCards()+`<div class="dashboard-grid"><div><section class="panel"><div class="panel-header"><div><h2>الأعمال المسندة إليك</h2><div class="panel-sub">أعمالك الحالية ولم تُغلق بعد</div></div><button class="small-link" onclick="go('records')">عرض الكل ←</button></div><div class="list">${mine.length?mine.map(workCard).join(''):`<div class="empty"><strong>ما عندك أعمال مفتوحة الآن</strong>اختر موظفًا آخر لتجربة الأدوار.</div>`}</div></section><section class="panel"><div class="panel-header"><div><h2>طلبات استلام تنتظرك</h2><div class="panel-sub">قبول أو رفض التسليم مع توثيق القرار</div></div><button class="small-link" onclick="go('handoffs')">التفاصيل ←</button></div>${hand.length?hand.map(h=>`<div class="work-card" onclick="details(${h.itemId})"><div class="work-top"><strong>${esc(byId(h.itemId)?.title)}</strong><span class="pill pending">بانتظارك</span></div><p class="subtitle">من ${who(h.from)} • ${esc(h.next)}</p></div>`).join(''):`<div class="empty">لا توجد طلبات استلام بانتظارك</div>`}</section></div><div><section class="panel"><div class="panel-header"><div><h2>سجل النشاط الحديث</h2><div class="panel-sub">المعلومة محفوظة مع صاحب الإجراء وتوقيته</div></div></div><div class="timeline">${recent.map(e=>`<div class="event"><strong>${esc(e.text)}</strong>${esc(e.title)}<small> • ${esc(who(e.by))} • ${fmt(e.at)}</small></div>`).join('')}</div></section><section class="panel" style="background:#e8f5f1;border-color:#cfe9e0"><h2>مبدأ التسليم المعتمد</h2><p style="margin:8px 0 0;font-size:13px;color:#54736c">إرسال المهمة لموظف آخر لا ينقل المسؤولية فورًا؛ تنتقل بعد أن يوافق المستلم، ويُحفظ الإقرار في سجل المهمة.</p></section></div></div>`}
function records(){const matches=db.items.filter(x=>(statusFilter==='all'||x.status===statusFilter)&&(departmentFilter==='all'||x.department===departmentFilter)&&[x.title,x.description,x.site,x.department,who(x.assignee)].join(' ').toLowerCase().includes(searchText.toLowerCase()));return heading('سجل المؤسسة','كل الأعمال والتحديثات','تصفّح سجلات العمل والمهام، وافتح التفاصيل لمتابعة تسلسل الأحداث.')+`<div class="filters"><input class="input" placeholder="ابحث عن مهمة أو موقع أو موظف…" value="${esc(searchText)}" oninput="searchText=this.value;updateRecords()" aria-label="البحث في السجل"><select class="select" onchange="statusFilter=this.value;updateRecords()" aria-label="تصفية بالحالة"><option value="all">جميع الحالات</option>${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${statusFilter===k?'selected':''}>${v}</option>`).join('')}</select><select class="select" onchange="departmentFilter=this.value;updateRecords()" aria-label="تصفية بالقسم"><option value="all">جميع الأقسام</option>${DEPARTMENTS.map(d=>`<option ${departmentFilter===d?'selected':''}>${d}</option>`).join('')}</select></div><div id="recordResults">${recordResults(matches)}</div>`}
function recordResults(matches){return matches.length?`<div class="record-grid">${matches.slice().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).map(workCard).join('')}</div>`:`<div class="empty"><strong>لا توجد نتائج مطابقة</strong>جرّب تغيير البحث أو الفلتر.</div>`}
function updateRecords(){if(activePage!=='records')return;const matches=db.items.filter(x=>(statusFilter==='all'||x.status===statusFilter)&&(departmentFilter==='all'||x.department===departmentFilter)&&[x.title,x.description,x.site,x.department,who(x.assignee)].join(' ').toLowerCase().includes(searchText.toLowerCase()));document.getElementById('recordResults').innerHTML=recordResults(matches)}
function handoffs(){const relevant=db.handoffs.filter(h=>h.to===activeUser||h.from===activeUser||activeUser==='manager');const ordered=relevant.slice().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));return heading('انتقال المسؤوليات','التسليم والاستلام','كل تسليم له مرسل ومستلم وحالة وإقرار محفوظ في السجل.',false)+`<section class="panel"><div class="panel-header"><div><h2>طلبات التسليم</h2><div class="panel-sub">يمكنك تبديل المستخدم من الأعلى لتجربة قبول الاستلام</div></div><span class="pill">${ordered.length} طلب</span></div>${ordered.length?ordered.map(h=>{const x=byId(h.itemId);return `<article class="handoff-card"><div class="hsplit"><div><strong>${esc(x?.title||'مهمة محذوفة')}</strong><div class="flow-users"><span>${esc(who(h.from))}</span><span class="flow-arrow">←</span><span>${esc(who(h.to))}</span></div></div><span class="pill ${h.status==='pending'?'pending':h.status==='accepted'?'completed':'high'}">${{pending:'بانتظار الاستلام',accepted:'تم الاستلام',rejected:'مرفوض',cancelled:'ملغي'}[h.status]}</span></div><p><b>ما أُنجز:</b> ${esc(h.summary||'غير مذكور')}</p><p><b>المطلوب:</b> ${esc(h.next)}</p>${h.responseNote?`<p><b>رد المستلم:</b> ${esc(h.responseNote)}</p>`:''}<div class="work-meta"><span>أُرسل: ${fmt(h.createdAt)}</span>${h.respondedAt?`<span>رُدّ عليه: ${fmt(h.respondedAt)}</span>`:''}</div><div class="btnrow" style="margin-top:14px"><button class="btn sm" onclick="details(${h.itemId})">التفاصيل</button>${h.status==='pending'&&h.to===activeUser?`<button class="btn sm primary" onclick="respond(${h.id},'accepted')">✓ قبول الاستلام</button><button class="btn sm danger" onclick="rejectModal(${h.id})">رفض الاستلام</button>`:''}</div></article>`}).join(''):`<div class="empty"><strong>لا توجد تسليمات لك بعد</strong>أنشئ مهمة أو انتقل لحساب أحمد واطلب تسليمها لخالد.</div>`}</section>`}
function manager(){const overdueItems=db.items.filter(overdue);const byDept=DEPARTMENTS.map(d=>({name:d,n:db.items.filter(x=>x.department===d).length}));const all=db.items.length;return heading('المدير والمشرف','لوحة متابعة المؤسسة','مؤشرات كلية تجريبية للأقسام والمهام والتسليمات.')+statCards()+`<div class="dashboard-grid"><div><section class="panel"><div class="panel-header"><div><h2>المهام المتأخرة</h2><div class="panel-sub">الأعمال غير المكتملة بعد موعدها</div></div><span class="pill high">${overdueItems.length} متأخرة</span></div><div class="list">${overdueItems.length?overdueItems.map(workCard).join(''):`<div class="empty">لا توجد أعمال متأخرة</div>`}</div></section><section class="panel"><div class="panel-header"><div><h2>أحدث التسليمات</h2><div class="panel-sub">آخر انتقالات المسؤوليات داخل المؤسسة</div></div></div>${db.handoffs.slice().reverse().slice(0,4).map(h=>`<div class="work-card" onclick="details(${h.itemId})"><div class="work-top"><strong>${esc(byId(h.itemId)?.title)}</strong><span class="pill ${h.status==='pending'?'pending':'completed'}">${h.status==='pending'?'بانتظار الإقرار':h.status==='accepted'?'تم الاستلام':'مرفوض'}</span></div><p class="subtitle">${who(h.from)} ← ${who(h.to)} • ${fmt(h.createdAt)}</p></div>`).join('')||'<div class="empty">لا توجد تسليمات</div>'}</section></div><div><section class="panel"><h2>الأعمال حسب القسم</h2><p class="panel-sub">إجمالي ${all} عناصر مسجلة</p><div class="manager-bars">${byDept.map(d=>`<div class="bar-row"><span class="bar-label">${d.name}</span><div class="bar-bg"><div class="bar-fill" style="width:${all?Math.max(3,100*d.n/all):0}%"></div></div><span class="bar-count">${d.n}</span></div>`).join('')}</div></section><section class="panel"><h2>مؤشر يحتاج متابعة</h2><p class="subtitle" style="margin-top:10px">${db.handoffs.filter(h=>h.status==='pending').length} طلب تسليم لم يقرّه المستلم بعد.</p><div class="rule"></div><p class="subtitle">في النظام الحقيقي يمكن إضافة فلترة الموقع والفريق وتقارير تاريخية ومدة انتظار كل تسليم.</p></section></div></div>`}
function createPage(){return heading('عنصر عمل جديد','أضف تحديثًا أو مهمة','وثّق ما حدث وما يحتاج متابعة؛ يمكنك اختيار المسؤول ومرفقات توضيحية.',false)+`<section class="panel" style="max-width:890px"><form id="newForm" onsubmit="saveNew(event)"><div class="form-grid"><label class="field full">عنوان العمل <span class="required">*</span><input class="input" name="title" required minlength="3" maxlength="200" placeholder="مثل: متابعة فحص جهاز التكييف"></label><label class="field">نوع السجل<select class="select" name="type"><option>مهمة</option><option>مشكلة</option><option>ملاحظة</option><option>إنجاز</option></select></label><label class="field">الأولوية<select class="select" name="priority"><option value="normal">متوسطة</option><option value="low">منخفضة</option><option value="high">عالية</option><option value="critical">حرجة</option></select></label><label class="field">القسم<select class="select" name="department">${DEPARTMENTS.map(d=>`<option>${d}</option>`).join('')}</select></label><label class="field">الموقع<input class="input" name="site" value="المكتب الرئيسي" placeholder="الموقع أو الفرع"></label><label class="field full">وش صار في العمل؟ <span class="required">*</span><textarea class="textarea" name="description" required minlength="5" placeholder="اكتب ملخصًا واضحًا لما حدث أو تم إنجازه"></textarea></label><label class="field full">وش يحتاج الموظف التالي يعرف أو يسوي؟<textarea class="textarea" name="nextSteps" placeholder="الخطوات القادمة، المخاطر، أو ملاحظات التسليم"></textarea></label><label class="field">الموظف المسؤول<select class="select" name="assignee">${Object.entries(PEOPLE).filter(([k])=>k!=='manager').map(([k,v])=>`<option value="${k}" ${k===activeUser?'selected':''}>${v.name}</option>`).join('')}</select></label><label class="field">الموعد المطلوب<input class="input" type="date" name="dueDate"></label><label class="field full">المرفقات<div class="upload">📎 صور أو فيديو أو تسجيل صوت أو مستندات <span class="hint">(عرض أسماء الملفات فقط في هذا النموذج)</span><input type="file" name="attachments" multiple accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx" aria-label="اختيار الملفات"></div></label></div><div class="helper-note">هذا نموذج واجهة فقط: الملفات لا تُرفع ولا تُحفَظ. لا تضف بيانات سرية أو حقيقية.</div><div class="btnrow" style="margin-top:22px"><button class="btn primary" type="submit">حفظ في سجل العمل</button><button class="btn" type="button" onclick="go('home')">إلغاء</button></div></form></section>`}
function saveNew(e){e.preventDefault();const f=e.target;const el=name=>f.elements.namedItem(name);const title=el('title').value.trim(),description=el('description').value.trim();if(title.length<3||description.length<5)return notify('أكمل العنوان والوصف قبل الحفظ');const files=Array.from(el('attachments').files||[]).map(z=>({name:z.name,type:z.type}));const x={id:++db.nextId,title,type:el('type').value,description,nextSteps:el('nextSteps').value.trim(),department:el('department').value,site:el('site').value.trim()||'غير محدد',priority:el('priority').value,status:'open',assignee:el('assignee').value,creator:activeUser,createdAt:now(),dueAt:el('dueDate').value?new Date(el('dueDate').value+'T20:00:00+03:00').toISOString():null,attachments:files,events:[{at:now(),by:activeUser,text:'أنشأ سجل العمل'}]};db.items.unshift(x);setDB();notify('تم حفظ السجل التجريبي');go('records')}
function details(id){const x=byId(id);if(!x)return;const h=db.handoffs.filter(r=>r.itemId===id).slice().reverse();const canEdit=x.assignee===activeUser||activeUser==='manager';const canHandoff=canEdit&&x.status!=='completed'&&x.status!=='pending';const pending=h.find(z=>z.status==='pending');const actions=`${canHandoff?`<button class="btn primary sm" onclick="handoffModal(${id})">↔ طلب تسليم</button>`:''}${canEdit&&['open','reopened'].includes(x.status)?`<button class="btn sm" onclick="progress(${id})">بدء العمل</button>`:''}${canEdit&&['open','in_progress','reopened'].includes(x.status)?`<button class="btn sm" onclick="complete(${id})">✓ إغلاق المهمة</button>`:''}${activeUser==='manager'&&x.status==='completed'?`<button class="btn sm" onclick="reopen(${id})">إعادة فتح</button>`:''}<button class="btn sm ghost" onclick="closeModal()">إغلاق النافذة</button>`;document.getElementById('modalRoot').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true" aria-label="تفاصيل المهمة"><div class="modal-head"><div><div class="eyebrow">مهمة #${x.id}</div><h2 style="margin:3px 0;font-size:20px">${esc(x.title)}</h2></div><button class="modal-close" aria-label="إغلاق" onclick="closeModal()">×</button></div><div class="modal-body"><div class="detail-data">${statusPill(x.status)}${priorityPill(x.priority)}<span class="pill">${esc(x.department)}</span><span class="pill">${esc(x.site)}</span>${overdue(x)?'<span class="pill high">متأخرة</span>':''}</div><div class="btnrow"><b>المسؤول الحالي: ${who(x.assignee)}</b>${pending?`<span class="pill pending">المستلم المقترح: ${who(pending.to)}</span>`:''}</div><div style="margin-top:16px"><span class="t-label">وصف العمل</span><div class="d-block">${esc(x.description)}</div><span class="t-label">الخطوة التالية</span><div class="d-block">${esc(x.nextSteps||'لم تُحدد خطوات متابعة')}</div></div><div class="detail-data"><span class="pill">تاريخ الإنشاء: ${fmt(x.createdAt)}</span>${x.dueAt?`<span class="pill">الاستحقاق: ${fmt(x.dueAt)}</span>`:''}</div>${x.attachments.length?`<div><span class="t-label">مرفقات للعرض فقط</span><div class="btnrow">${x.attachments.map(a=>`<span class="pill">📎 ${esc(a.name)}</span>`).join('')}</div></div>`:''}<div class="rule"></div><h3 style="font-size:14px">سجل الأحداث</h3><div class="timeline">${x.events.slice().reverse().map(e=>`<div class="event"><strong>${esc(e.text)}</strong><small>${who(e.by)} • ${fmt(e.at)}</small></div>`).join('')}</div>${canEdit&&x.status!=='completed'?`<form onsubmit="addUpdate(event,${id})" style="margin-top:15px"><label class="field">إضافة تحديث<textarea class="textarea" required minlength="3" name="update" placeholder="وش صار بعد آخر تحديث؟" style="min-height:65px"></textarea></label><button type="submit" class="btn sm" style="margin-top:8px">إضافة للسجل</button></form>`:''}</div><div class="modal-actions">${actions}</div></div></div>`;document.addEventListener('keydown',escHandler)}
function escHandler(e){if(e.key==='Escape')closeModal()}
function closeModal(){document.getElementById('modalRoot').innerHTML='';document.removeEventListener('keydown',escHandler)}
function addUpdate(e,id){e.preventDefault();const x=byId(id),message=e.target.elements.update.value.trim();if(!message)return; x.events.push({at:now(),by:activeUser,text:message});if(x.status==='open')x.status='in_progress';setDB();notify('تم حفظ التحديث');details(id)}
function handoffModal(id){const x=byId(id);if(!x)return;document.getElementById('modalRoot').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true" aria-label="تسليم العمل"><div class="modal-head"><h2 style="margin:0">طلب تسليم: ${esc(x.title)}</h2><button class="modal-close" aria-label="إغلاق" onclick="closeModal()">×</button></div><form onsubmit="saveHandoff(event,${id})"><div class="modal-body"><div class="helper-note" style="margin:0 0 17px">المسؤولية تبقى لدى ${who(x.assignee)} حتى يقبل المستلم الجديد رسميًا.</div><div class="form-grid"><label class="field full">تسليم إلى <span class="required">*</span><select class="select" name="to" required>${Object.entries(PEOPLE).filter(([k])=>k!==x.assignee&&k!=='manager').map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('')}</select></label><label class="field full">ما تم إنجازه؟<textarea class="textarea" name="summary" placeholder="آخر ما تم في المهمة" style="min-height:70px"></textarea></label><label class="field full">المطلوب من المستلم <span class="required">*</span><textarea class="textarea" name="next" required minlength="3" placeholder="وش الخطوة التالية المطلوبة؟" style="min-height:80px">${esc(x.nextSteps||'')}</textarea></label></div></div><div class="modal-actions"><button class="btn primary" type="submit">إرسال طلب التسليم</button><button class="btn" type="button" onclick="closeModal()">إلغاء</button></div></form></div></div>`}
function saveHandoff(e,id){e.preventDefault();const x=byId(id),f=e.target,el=name=>f.elements.namedItem(name);if(!x||x.status==='pending'||x.status==='completed')return notify('لا يمكن تسليم هذه المهمة الآن');if(x.assignee!==activeUser&&activeUser!=='manager')return notify('لا تملك صلاحية التسليم');const h={id:++db.nextId,itemId:id,from:x.assignee,to:el('to').value,summary:el('summary').value.trim(),next:el('next').value.trim(),status:'pending',createdAt:now(),respondedAt:null,responseNote:''};if(!h.next)return notify('أدخل المطلوب من المستلم');db.handoffs.push(h);x.status='pending';x.events.push({at:now(),by:activeUser,text:'طلب تسليم إلى '+who(h.to)});setDB();closeModal();notify('تم إرسال طلب التسليم. المسؤولية لم تنتقل بعد.');go('handoffs')}
function respond(id,result,note=''){const h=db.handoffs.find(v=>v.id===id),x=h&&byId(h.itemId);if(!h||!x||h.status!=='pending')return;if(h.to!==activeUser)return notify('يستطيع المستلم المحدد فقط الرد على الطلب');h.status=result;h.respondedAt=now();h.responseNote=note;if(result==='accepted'){x.assignee=h.to;x.status='in_progress';x.nextSteps=h.next;x.events.push({at:now(),by:activeUser,text:'قبل استلام المسؤولية من '+who(h.from)});notify('تم قبول التسليم وانتقلت المسؤولية إليك')}else{x.status='in_progress';x.events.push({at:now(),by:activeUser,text:'رفض الاستلام: '+note});notify('تم الرفض وبقيت المسؤولية لدى المرسل')}setDB();closeModal();render()}
function rejectModal(id){document.getElementById('modalRoot').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true" aria-label="رفض التسليم"><div class="modal-head"><h2 style="margin:0">رفض طلب الاستلام</h2><button class="modal-close" onclick="closeModal()">×</button></div><form onsubmit="event.preventDefault();respond(${id},'rejected',this.elements.namedItem('reason').value.trim())"><div class="modal-body"><label class="field">سبب الرفض <span class="required">*</span><textarea class="textarea" required minlength="3" name="reason" placeholder="مثل: الطلب يحتاج معلومات إضافية قبل الاستلام"></textarea></label></div><div class="modal-actions"><button class="btn danger" type="submit">تأكيد الرفض</button><button class="btn" onclick="closeModal()" type="button">إلغاء</button></div></form></div></div>`}
function progress(id){const x=byId(id);if(!x)return;x.status='in_progress';x.events.push({at:now(),by:activeUser,text:'بدأ العمل على المهمة'});setDB();notify('تم تحديث الحالة');details(id)}
function complete(id){const x=byId(id);if(!x||x.status==='pending')return;if(x.assignee!==activeUser&&activeUser!=='manager')return notify('غير مخوّل بإغلاق المهمة');const message=window.prompt('ما ملخص الإنجاز قبل الإغلاق؟','تم إنجاز المطلوب والتحقق من النتيجة.');if(message===null)return;if(!message.trim())return notify('اكتب ملخص الإنجاز');x.status='completed';x.events.push({at:now(),by:activeUser,text:'أغلق المهمة: '+message.trim()});setDB();notify('أُغلقت المهمة بنجاح');details(id)}
function reopen(id){const x=byId(id);if(!x||activeUser!=='manager')return;const reason=window.prompt('سبب إعادة فتح المهمة:','تحتاج مراجعة إضافية.');if(reason===null||!reason.trim())return;x.status='reopened';x.events.push({at:now(),by:activeUser,text:'أعاد فتح المهمة: '+reason.trim()});setDB();notify('تمت إعادة فتح المهمة');details(id)}
function switchUser(id){activeUser=id;document.getElementById('avatar').textContent=PEOPLE[id].initial;render();notify('تجربة العرض الآن باسم '+who(id))}
function go(page){activePage=page;closeModal();render();window.scrollTo({top:0,behavior:'auto'})}
function render(){renderNav();document.getElementById('userSelect').value=activeUser;document.getElementById('avatar').textContent=PEOPLE[activeUser].initial;document.getElementById('view').innerHTML=({home:dashboard,records, handoffs,manager,new:createPage}[activePage]||dashboard)()}
function resetDemo(){if(!window.confirm('إعادة جميع البيانات التجريبية إلى حالتها الأصلية؟'))return;db=seed();setDB();go('home');notify('أُعيدت البيانات التجريبية')}
document.getElementById('userSelect').innerHTML=Object.entries(PEOPLE).map(([id,p])=>`<option value="${id}">${p.name} · ${p.role}</option>`).join('');
const resetButton=document.createElement('button');resetButton.className='nav-btn';resetButton.innerHTML='<span class="emoji">↻</span>إعادة البيانات التجريبية';resetButton.onclick=resetDemo;document.getElementById('nav').addEventListener('click',()=>{});
const oldRender=renderNav;renderNav=function(){oldRender();document.getElementById('nav').append(resetButton)};
render();
</script>
</body>
</html>
